# =============================================================================
# CI Workflow: Terraform Validate + Shell Lint + CX Agent Studio Deploy
# =============================================================================
# Triggers on push to main or PR against main.
#
# Jobs:
#   1. terraform-validate  — static checks only (no GCP required)
#   2. script-validate     — bash -n syntax check on all scripts
#   3. deploy-dev          — Apply + Version + Export (main push only,
#                            skipped when GCP vars are not configured)
# =============================================================================

name: "CI — CXAS Version & Export"

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"

env:
  TF_VERSION: "1.9.0"
  TF_WORKING_DIR: "terraform"

permissions:
  contents: read
  id-token: write # For Workload Identity Federation

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Terraform static checks — no GCP credentials required
  # ---------------------------------------------------------------------------
  terraform-validate:
    name: "Terraform Validate (${{ matrix.environment }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Let all 3 envs report independently
      matrix:
        environment: [dev, staging, prod]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init (no backend — static check only)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        # Report formatting drift but do not block CI
        continue-on-error: true
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

  # ---------------------------------------------------------------------------
  # Job 2: Shell script syntax check — no GCP credentials required
  # ---------------------------------------------------------------------------
  script-validate:
    name: "Shell Script Syntax Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell scripts (bash -n)
        run: |
          echo "=== Shell script syntax validation ==="
          ERRORS=0
          for script in scripts/*.sh; do
            if bash -n "$script" 2>&1; then
              echo "  ✅  $script"
            else
              echo "  ❌  $script — syntax error"
              ERRORS=$((ERRORS + 1))
            fi
          done
          echo "======================================="
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::${ERRORS} script(s) have syntax errors."
            exit 1
          fi
          echo "All scripts passed syntax check."

      - name: Check script permissions (warn only)
        continue-on-error: true
        run: |
          echo "=== Checking execute permissions ==="
          for script in scripts/*.sh; do
            if [ -x "$script" ]; then
              echo "  ✅  $script is executable"
            else
              echo "  ⚠️   $script is NOT executable (run: chmod +x $script)"
            fi
          done

  # ---------------------------------------------------------------------------
  # Job 3: Apply Terraform + Create Version + Export (main push only)
  #         Skipped when GCP repository variables are not configured.
  # ---------------------------------------------------------------------------
  deploy-dev:
    name: "Dev — Apply + Version + Export"
    runs-on: ubuntu-latest
    needs: [terraform-validate, script-validate]
    # Only run on push to main AND only when GCP project var is set
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.GCP_PROJECT_ID != ''
    environment: dev
    outputs:
      version_name: ${{ steps.create-version.outputs.version_name }}
      export_gcs_uri: ${{ steps.export-app.outputs.export_gcs_uri }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # --- Terraform Apply (infra only) ---
      - name: Terraform Init & Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -backend-config=environments/dev/backend.hcl
          terraform apply \
            -var-file=environments/dev/terraform.tfvars \
            -auto-approve

      # --- Create Version ---
      - name: Create CX Agent Studio Version
        id: create-version
        run: |
          chmod +x scripts/cxas-create-version.sh
          bash scripts/cxas-create-version.sh \
            --project-id=${{ vars.GCP_PROJECT_ID }} \
            --region=${{ vars.CXAS_REGION }} \
            --app-id=${{ vars.CXAS_APP_ID }} \
            --display-name="ci-${{ github.sha }}-$(date +%Y%m%d-%H%M%S)" \
            --description="CI build: ${{ github.sha }} by ${{ github.actor }}"

      # --- Export to GCS ---
      - name: Export Agent Application
        id: export-app
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          GCS_URI="gs://${{ vars.GCP_PROJECT_ID }}-cxas-exports-dev/ci/${TIMESTAMP}-${{ github.sha }}.zip"
          chmod +x scripts/cxas-export-app.sh
          bash scripts/cxas-export-app.sh \
            --project-id=${{ vars.GCP_PROJECT_ID }} \
            --region=${{ vars.CXAS_REGION }} \
            --app-id=${{ vars.CXAS_APP_ID }} \
            --gcs-uri="${GCS_URI}"

      # --- List Versions for Audit ---
      - name: List Current Versions
        run: |
          chmod +x scripts/cxas-list-versions.sh
          bash scripts/cxas-list-versions.sh \
            --project-id=${{ vars.GCP_PROJECT_ID }} \
            --region=${{ vars.CXAS_REGION }} \
            --app-id=${{ vars.CXAS_APP_ID }}
